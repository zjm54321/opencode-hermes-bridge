name: Publish native OpenCode plugin

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'zjm54321/opencode-hermes-bridge' && !github.event.repository.private && !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Set up locked Bun version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Verify stable version and main ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')
          [[ "$RELEASE_TAG" == "v$version" ]]
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD
          [[ "$(bun --version)" == '1.4.2' ]]
          node -e 'const [major,minor,patch] = process.argv[1].split(".").map(Number); if (!(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) process.exit(1)' "$(npm --version)"

      - name: Check locked native source
        run: |
          set -euo pipefail
          mkdir -p /tmp/opencode
          bun install --frozen-lockfile --ignore-scripts
          bun run typecheck
          bun test tests/unit

      - name: Build and verify the actual tarball in a consumer
        run: |
          set -euo pipefail
          node scripts/package-native.mjs "$RUNNER_TEMP/native-package"

      - name: Publish the inspected tarball using npm trusted publishing
        run: |
          set -euo pipefail
          # Configure the npm trusted publisher for this repository and workflow first.
          # A nonexistent package needs an owner-run first publication; no token fallback.
          unset NPM_TOKEN NODE_AUTH_TOKEN
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/native-package/empty-user.npmrc"
          export NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/native-package/empty-global.npmrc"
          export NPM_CONFIG_CACHE="$RUNNER_TEMP/native-package/cache"
          export NPM_CONFIG_REGISTRY=https://registry.npmjs.org/
          report="$RUNNER_TEMP/native-package/package-report.json"
          node --input-type=module -e 'import fs from "node:fs"; import crypto from "node:crypto"; import assert from "node:assert/strict"; const r=JSON.parse(fs.readFileSync(process.argv[1])); assert.equal(crypto.createHash("sha256").update(fs.readFileSync(r.tarball)).digest("hex"),r.sha256)' "$report"
          tarball=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).tarball' "$report")
          cd "$RUNNER_TEMP/native-package"
          npm publish "$tarball" --access public --ignore-scripts
