[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-hermes-companion"
version = "0.1.0"
description = "Authenticated, persistent local HTTP companion for Hermes Agent"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = []

[project.scripts]
hermes-bridge = "hermes_bridge.server:main"

[tool.setuptools.packages.find]
where = ["companion"]
include = ["hermes_bridge*"]
